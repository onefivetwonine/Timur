name: timur-poc
services:
  database:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: timur_poc
      POSTGRES_USER: timur_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make poc-init and supply .local/poc.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run make poc-init and supply .local/poc.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - poc-postgres:/var/lib/postgresql/data
      - ./scripts/dev/init-db.sh:/docker-entrypoint-initdb.d/10-init-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timur_owner -d timur_poc"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    profiles: ["application"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      TIMUR_ENVIRONMENT: poc
      TIMUR_DATA_MODE: synthetic
      TIMUR_AI_PROVIDER: deterministic
      TIMUR_EXTERNAL_AI_ENABLED: "false"
      DATABASE_URL: postgresql://timur_app:${APP_DB_PASSWORD}@database:5432/timur_poc
      PORT: "8000"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      database: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  web:
    profiles: ["application"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      TIMUR_ENVIRONMENT: poc
      TIMUR_DATA_MODE: synthetic
      TIMUR_AI_PROVIDER: deterministic
      TIMUR_EXTERNAL_AI_ENABLED: "false"
      PORT: "3000"
    ports: ["127.0.0.1:3000:3000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  worker:
    profiles: ["application"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      TIMUR_ENVIRONMENT: poc
      TIMUR_DATA_MODE: synthetic
      TIMUR_AI_PROVIDER: deterministic
      TIMUR_EXTERNAL_AI_ENABLED: "false"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes:
  poc-postgres:
